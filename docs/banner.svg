<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="agent-rewind — an undo button for AI coding agents">
  <title>agent-rewind — an undo button for AI coding agents</title>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
    <mask id="dots-mask">
      <rect x="720" y="0" width="560" height="300" fill="url(#fade)"/>
    </mask>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#6366F1" opacity="0.38"/>
    </pattern>
  </defs>

  <!-- ambient glow -->
  <ellipse cx="340" cy="150" rx="440" ry="210" fill="url(#glow)"/>

  <!-- dot grid, fading in from the left -->
  <rect x="720" y="0" width="560" height="300" fill="url(#dots)" mask="url(#dots-mask)"/>

  <!-- logo tile -->
  <rect x="64" y="78" width="96" height="96" rx="24" fill="url(#brand)"/>
  <path d="M104 104 L82 126 L104 148" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M142 104 L120 126 L142 148" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.62"/>

  <!-- wordmark -->
  <text x="200" y="152" font-family="'SF Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace" font-size="64" font-weight="700" fill="#0F172A" textLength="430" lengthAdjust="spacing">agent-rewind</text>

  <!-- terminal cursor -->
  <rect x="646" y="103" width="12" height="54" rx="2" fill="#6366F1"/>

  <!-- tagline -->
  <text x="202" y="196" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="26" fill="#475569">An undo button for AI coding agents.</text>

  <!-- accent bar -->
  <rect x="202" y="218" width="72" height="4" rx="2" fill="url(#brand)"/>
</svg>
